<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Workday Autofill Options</title>
  <style>
    body {
      max-width: 800px;
      margin: 0 auto;
      background-color: #222;
      color: #fff;
      font-family: sans-serif;
      padding: 20px;
    }
    h2 { margin: 0 0 10px; font-size: 18px; }
    p { color: #aaa; font-size: 14px; }
    textarea {
      width: 100%;
      height: 60vh;
      box-sizing: border-box;
      background-color: #111;
      color: #eee;
      border: 1px solid #444;
      font-family: monospace;
      font-size: 13px;
      padding: 10px;
    }
    .buttons { margin-top: 10px; display: flex; gap: 8px; flex-wrap: wrap; }
    button {
      background-color: #333;
      color: #fff;
      border: 1px solid #555;
      padding: 8px 14px;
      cursor: pointer;
    }
    button:hover { background-color: #444; }
    #save { background-color: #2e7d32; border-color: #4CAF50; }
    #status { margin-top: 10px; font-size: 14px; min-height: 1em; }
    .ok { color: #4CAF50; }
    .error { color: #f44336; }
  </style>
</head>
<body>
  <h2>Workday Autofill — Profile Data</h2>
  <p>Paste your profile JSON below (same structure as <code>data.example.json</code>) and click Save.
     It is stored locally in the browser and used instead of a bundled <code>data.json</code>.</p>
  <textarea id="profile" spellcheck="false" placeholder="{ &quot;firstName&quot;: &quot;Jane&quot;, ... }"></textarea>
  <div class="buttons">
    <button id="save">Save</button>
    <button id="importBundled">Import bundled data.json</button>
    <button id="format">Format JSON</button>
    <button id="clear">Clear saved data</button>
  </div>
  <div id="status"></div>
  <script src="options.js"></script>
</body>
</html>
